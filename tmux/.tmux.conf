set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Set the prefix to Ctrl+a
set -g prefix C-a

# Unbind the old prefix
unbind C-b

# Send Ctr+a to applications by pressing it twice
bind C-a send-prefix

# Pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# Dont confirm before killing pane
# bind-key x kill-pane

# Split panes in a more mnemonic way
bind | split-window -h
bind - split-window -v

# fzf tmux sessions
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# setting 4 channel sessionizer
bind-key -r M-1 run-shell "~/.local/bin/tmux-sessionizer --tab 1"
bind-key -r M-2 run-shell "~/.local/bin/tmux-sessionizer --tab 2"
bind-key -r M-3 run-shell "~/.local/bin/tmux-sessionizer --tab 3"
bind-key -r M-4 run-shell "~/.local/bin/tmux-sessionizer --tab 4"

# move current session to specified index
bind-key -r M-! run-shell "~/.local/bin/tmux-sessionizer --set-tab 1"
bind-key -r M-@ run-shell "~/.local/bin/tmux-sessionizer --set-tab 2"
bind-key -r M-# run-shell "~/.local/bin/tmux-sessionizer --set-tab 3"
bind-key -r M-$ run-shell "~/.local/bin/tmux-sessionizer --set-tab 4"

# join pane
bind-key -r S choose-window "join-pane -h -t "%%""


# open root shell
bind-key -r R run-shell "tmux neww ~/.local/bin/tmux-sessionizer ~/apps"

# make selected panes more obvious
set -g window-style 'fg=colour247,bg=colour235'
set -g window-active-style 'fg=default,bg=colour234'

# Pane border
set -g pane-border-style 'bg=default,fg=colour238'
set -g pane-active-border-style 'bg=default,fg=blue'

# Sort by session creation
bind s choose-tree -sZ -O index
